<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E3192">
  <meta name="description" content="Prepare a lost PWD ID inquiry for Marinduque.">
  <title>Lost PWD ID — e-Gabay Marinduque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="portal-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand brand-lockup" id="form-portal-link" href="pwd.html" aria-label="PWD portal">
          <span class="brand-mark" aria-hidden="true"><span>e</span></span>
          <span class="brand-text">e-Gabay <span>PWD</span><small>MARINDUQUE</small></span>
        </a>
        <div class="portal-nav-links"><span class="portal-role-label">LOST PWD ID</span></div>
      </div>
    </nav>
  </header>
  <main id="main-content" class="portal-main container">
    <section class="portal-hero">
      <div class="eyebrow"><span class="eyebrow-line"></span> PWD ID inquiry</div>
      <h1>Report a lost PWD ID.</h1>
      <p class="portal-intro">Prepare a replacement inquiry and attach an Affidavit of Loss.</p>
    </section>
    <article class="portal-card role-form-card id-application-page">
      <p>Complete the fields below to create a reference ID for your inquiry.</p>
      <form id="id-application-form" class="id-application-form" novalidate>
        <input id="id-application-type" name="type" type="hidden" value="replacement">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="id-applicant-name">Applicant name</label><input class="form-control" id="id-applicant-name" name="name" autocomplete="name" required placeholder="Your name"></div>
          <div class="col-md-6"><label class="form-label" for="id-applicant-municipality">Municipality</label><select class="form-select" id="id-applicant-municipality" name="municipality" required><option value="">Choose one</option><option>Boac</option><option>Mogpog</option><option>Gasan</option><option>Buenavista</option><option>Santa Cruz</option><option>Torrijos</option></select></div>
          <div class="col-12 document-upload-section" id="id-document-fields">
            <h2 class="document-upload-heading">Required documents</h2>
            <div class="row g-3">
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-application-form">Accomplished PWD ID Application Form</label><input class="form-control" id="document-application-form" name="applicationForm" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div>
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-medical-certificate">Updated Medical Certificate specifying the type of disability from a qualified specialist</label><input class="form-control" id="document-medical-certificate" name="medicalCertificate" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div>
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-barangay-certificate">Barangay Certificate / Clearance</label><input class="form-control" id="document-barangay-certificate" name="barangayCertificate" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div>
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-valid-id">Photocopy of a valid Government ID or School ID</label><input class="form-control" id="document-valid-id" name="validId" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div>
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-birth-marriage">Birth Certificate or Marriage Certificate <span class="optional">(if applicable)</span></label><input class="form-control" id="document-birth-marriage" name="birthOrMarriageCertificate" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-id-photos">Required ID photos</label><input class="form-control" id="document-id-photos" name="idPhotos" type="file" accept=".jpg,.jpeg,.png" multiple required></div>
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-whole-body">Whole-body photo <span class="optional">(for applicants with apparent disabilities)</span></label><input class="form-control" id="document-whole-body" name="wholeBodyPhoto" type="file" accept=".jpg,.jpeg,.png"></div>
              <div class="col-12 document-field" data-document-groups="replacement"><label class="form-label" for="document-affidavit-loss">Affidavit of Loss</label><input class="form-control" id="document-affidavit-loss" name="affidavitOfLoss" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div>
            </div>
          </div>
          <div class="col-12 form-consent"><input class="form-check-input" id="id-consent" type="checkbox" required><label class="form-check-label" for="id-consent">I confirm the applicant’s details are accurate and, if submitting on their behalf, that I have their authorization to create this inquiry reference.</label></div>
          <div class="col-12"><button class="btn btn-primary" type="submit">Create lost ID reference <span aria-hidden="true">→</span></button></div>
        </div>
      </form>
      <div class="form-feedback" id="id-form-feedback" role="status" aria-live="polite"></div>
      <a class="btn btn-outline-primary mt-3" id="form-back-link" href="pwd.html">← Back to PWD portal</a>
    </article>
  </main>
  <script src="app.js"></script>
</body>
</html>
