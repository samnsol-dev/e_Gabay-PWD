<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E3192">
  <meta name="description" content="Choose your e-Gabay PWD portal.">
  <title>Login or register — e-Gabay PWD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="portal-page auth-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand brand-lockup" href="index.html" aria-label="e-Gabay PWD home">
          <span class="brand-mark" aria-hidden="true"><span>e</span></span>
          <span class="brand-text">e-Gabay <span>PWD</span><small>MARINDUQUE</small></span>
        </a>
        <a class="text-link" href="index.html">Back to home</a>
      </div>
    </nav>
  </header>
  <main id="main-content" class="portal-main container">
    <section class="portal-card auth-card" aria-labelledby="auth-title">
      <div class="eyebrow"><span class="eyebrow-line"></span> Your e-Gabay portal</div>
      <h1 id="auth-title">Welcome <span>to e-Gabay.</span></h1>
      <p class="portal-intro">Choose your role to continue to the tools and information most relevant to you.</p>
      <div class="auth-tabs" role="tablist" aria-label="Account action">
        <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="auth-form" data-mode="login">Login</button>
        <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-form" data-mode="register">Register</button>
      </div>
      <form id="auth-form" novalidate>
        <div class="mb-3" id="name-field" hidden>
          <label class="form-label" for="account-name">Your name</label>
          <input class="form-control" id="account-name" name="name" autocomplete="name" placeholder="Your name">
        </div>
        <div class="mb-3" id="patient-name-field" hidden>
          <label class="form-label" for="patient-name">Patient’s name</label>
          <input class="form-control" id="patient-name" name="patientName" autocomplete="off" placeholder="Name of the person you care for">
        </div>
        <div class="mb-3">
          <label class="form-label" for="account-email">Email address</label>
          <input class="form-control" id="account-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label" for="account-password">Password</label>
          <input class="form-control" id="account-password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
        </div>
        <div class="mb-4">
          <label class="form-label" for="account-role">I am a</label>
          <select class="form-select" id="account-role" name="role" required>
            <option value="pwd">Person with a disability (PWD)</option>
            <option value="caregiver">Caregiver</option>
            <option value="staff">PDAO staff</option>
          </select>
        </div>
        
        <button class="btn btn-primary w-100" id="auth-submit" type="submit">Continue to portal</button>
        <p class="auth-feedback" id="auth-feedback" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
